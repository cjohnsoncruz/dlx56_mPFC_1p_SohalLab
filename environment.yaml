name: mPFC_1p_analysis
channels:
  - conda-forge
dependencies:
  - python=3.10.12
  # Core analysis/plotting
  - numpy=1.26.4
  - pandas=2.0.3
  - matplotlib>=3.8.0,<3.9.0  # 3.8+ for subfigure layout param, <3.9 for seaborn 0.12.1 compat
  - seaborn=0.12.1
  - matplotlib-venn=0.11.10

  # Stats
  - scipy=1.14.1
  - statsmodels=0.14.4
  - pingouin=0.5.5

  # I/O
  - openpyxl=3.1.5
  - pyarrow>=14.0.0  # parquet engine for pandas.read_parquet (14.0+ for Python 3.12 support)
  - h5py>=3.8.0  # MATLAB file loading
  - pyyaml>=6.0  # YAML configuration files

  # ML / utils
  - scikit-learn=1.5.2

  # Performance / Parallelization
  - joblib>=1.3.0  # parallel processing for shuffles
  - numba>=0.58.0  # JIT compilation for shuffle optimization
  - psutil>=5.9.0  # CPU core detection for parallel processing

  # Notebook execution stack
  - nbclient=0.8.0
  - nbformat=5.10.4
  - ipykernel=6.29.5
  - pyzmq=25.1.2
  - tornado  # leave unpinned to resolve compat on Windows

  - pip
  - pip:
      # pip-only
      - mat73
      - umap-learn==0.5.3
